name: Validate ExitCheck
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run template:check
      - run: npm run check
      - name: HTTP smoke test
        run: |
          npm start > /tmp/exitcheck.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then break; fi
            sleep 1
          done
          npm run smoke
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser flows
        run: npm run e2e
